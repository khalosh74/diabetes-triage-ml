name: release (diagnostic)

on:
  push:
    tags: ["v*"]            # run when pushing a tag like v0.2.13
  workflow_dispatch:        # allow manual runs

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: write       # create/update GitHub Release
      packages: write       # push images to GHCR

    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PYTHON_VERSION: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps & train (emit artifacts)
        run: |
          set -eux
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python src/diaclinic/train.py
          ls -al artifacts

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts/*

      # ---------- DIAGNOSTICS ----------
      - name: Debug context
        run: |
          echo "ref=${GITHUB_REF}"
          echo "ref_name=${GITHUB_REF_NAME}"
          echo "actor=${GITHUB_ACTOR}"
          echo "repo=${GITHUB_REPOSITORY}"
          echo "owner=${GITHUB_REPOSITORY_OWNER}"
          echo "IMAGE=${IMAGE}"
          test -f Dockerfile && echo "Dockerfile present ✅" || (echo "Dockerfile missing ❌"; exit 1)

      - name: Derive version
        id: ver
        run: |
          set -e
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "Using version=$(grep '^version=' $GITHUB_OUTPUT | cut -d= -f2)"

      - name: Check PAT presence (no secrets printed)
        run: |
          if [ -n "${{ secrets.GHCR_PAT }}" ]; then
            echo "GHCR_PAT is set ✅"
          else
            echo "GHCR_PAT missing ❌"; exit 1
          fi

      - name: Login to GHCR (PAT)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}     # resolves to "khalosh74"
          password: ${{ secrets.GHCR_PAT }}

      - name: Quick GHCR pushcheck (diagnostic)
        run: |
          set -eux
          docker pull busybox:latest
          docker tag busybox:latest "${IMAGE}-pushcheck:${{ steps.ver.outputs.version }}"
          docker push "${IMAGE}-pushcheck:${{ steps.ver.outputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Show tags to be published
        run: |
          echo "Tag 1: ${IMAGE}:${{ steps.ver.outputs.version }}"
          echo "Tag 2: ${IMAGE}:latest"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          # Use a block STRING (not a YAML sequence) for tags:
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Smoke test container
        run: |
          set -eux
          docker run -d --rm -p 8000:8000 --name diaclinic "${IMAGE}:${{ steps.ver.outputs.version }}"
          for i in {1..30}; do curl -sf http://localhost:8000/ready >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8000/health | head -c 200
          curl -sf -X POST http://localhost:8000/predict_one \
            -H "Content-Type: application/json" \
            -d '{"age":0,"sex":0,"bmi":0,"bp":0,"s1":0,"s2":0,"s3":0,"s4":0,"s5":0,"s6":0}' >/dev/null
          docker logs diaclinic || true
          docker stop diaclinic

      - id: read_metrics
        name: Capture metrics for release notes
        run: |
          { echo "metrics<<EOF"; cat artifacts/metrics.json; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with artifacts (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Metrics
            ```
            ${{ steps.read_metrics.outputs.metrics }}
            ```
          # Keep artifacts as a single string (comma-separated), not a YAML list:
          artifacts: artifacts/metrics.json,artifacts/model.pkl
          allowUpdates: true
      # ---------- END DIAGNOSTICS ----------
