name: release

on:
  push:
    tags: ["v*"]          # runs when you push a tag like v0.2.11
  workflow_dispatch:       # allow manual runs from the Actions tab

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    # Needed for publishing releases and (optionally) packages
    permissions:
      contents: write
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PYTHON_VERSION: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps & train (emit artifacts)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python src/diaclinic/train.py
          echo "== artifacts =="
          ls -al artifacts

      - name: Upload run artifacts (for CI provenance)
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts/*

      # 🔐 Use your PAT secret with write:packages + read:packages
      - name: Login to GHCR (PAT)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}     # resolves to "khalosh74"
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile         # you renamed it; keep explicit
          platforms: linux/amd64   # good default for most users
          push: true
          provenance: false        # avoid attestation quirks on some setups
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - name: Smoke test container
        run: |
          docker run -d --rm -p 8000:8000 --name diaclinic $IMAGE:${{ github.ref_name }}
          for i in {1..30}; do
            if curl -sf http://localhost:8000/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/health | head -c 200
          curl -sf -X POST http://localhost:8000/predict_one \
            -H "Content-Type: application/json" \
            -d '{"age":0,"sex":0,"bmi":0,"bp":0,"s1":0,"s2":0,"s3":0,"s4":0,"s5":0,"s6":0}' >/dev/null
          docker stop diaclinic

      - id: read_metrics
        name: Capture metrics for release notes
        run: |
          { echo "metrics<<EOF"; cat artifacts/metrics.json; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Metrics
            ```
            ${{ steps.read_metrics.outputs.metrics }}
            ```
          artifacts: |
            artifacts/metrics.json,
            artifacts/model.pkl
          allowUpdates: true
