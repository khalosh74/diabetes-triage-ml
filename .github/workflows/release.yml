name: release
on:
  push:
    tags: [ "v*" ]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
          IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps & train (emit metrics/artifacts)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python src/diaclinic/train.py
          cat artifacts/metrics.json

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - name: Smoke test container
        run: |
          docker run -d --rm -p 8000:8000 --name diaclinic $IMAGE:${{ github.ref_name }}
          # wait for readiness (max ~20s)
          for i in {1..20}; do
            if curl -sf http://localhost:8000/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/health | head -c 200
          curl -sf -X POST http://localhost:8000/predict_one \
            -H "Content-Type: application/json" \
            -d '{"age":0,"sex":0,"bmi":0,"bp":0,"s1":0,"s2":0,"s3":0,"s4":0,"s5":0,"s6":0}' >/dev/null
          docker stop diaclinic

      - id: read_metrics
        name: Capture metrics for release notes
        run: |
          echo 'metrics<<EOF' >> $GITHUB_OUTPUT
          cat artifacts/metrics.json >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Metrics
            ```
            ${{ steps.read_metrics.outputs.metrics }}
            ```
          artifacts: "artifacts/metrics.json,artifacts/model.pkl"
          allowUpdates: true
