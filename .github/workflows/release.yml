name: release

on:
  push:
    tags: ["v*"]         # run when you push a tag like v0.2.7
  workflow_dispatch:     # allow manual runs from the Actions tab

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # required for pushing to GHCR and creating a GitHub Release
    permissions:
      contents: write
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}   # e.g. ghcr.io/khalosh74/diabetes-triage-ml
      PROBE_IMAGE: ghcr.io/${{ github.repository }}-probe   # <— new, diagnostic

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps & train (emit metrics/artifacts)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python src/diaclinic/train.py
          echo "== metrics.json =="
          cat artifacts/metrics.json || true
          echo "== ls artifacts =="
          ls -al artifacts || true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push PROBE image (diagnostic)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.PROBE_IMAGE }}:${{ github.ref_name }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile               # <— you renamed it; keep explicit
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - name: Smoke test container
        run: |
          docker run -d --rm -p 8000:8000 --name diaclinic $IMAGE:${{ github.ref_name }}
          # wait for readiness (max ~20s)
          for i in {1..20}; do
            if curl -sf http://localhost:8000/ready >/dev/null; then break; fi
            sleep 1
          done
          # basic checks
          curl -sf http://localhost:8000/health | head -c 200
          curl -sf -X POST http://localhost:8000/predict_one \
            -H "Content-Type: application/json" \
            -d '{"age":0,"sex":0,"bmi":0,"bp":0,"s1":0,"s2":0,"s3":0,"s4":0,"s5":0,"s6":0}' >/dev/null
          docker stop diaclinic

      - id: read_metrics
        name: Capture metrics for release notes
        run: |
          echo 'metrics<<EOF' >> $GITHUB_OUTPUT
          cat artifacts/metrics.json >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Create GitHub Release with artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Metrics
            ```
            ${{ steps.read_metrics.outputs.metrics }}
            ```
          artifacts: "artifacts/metrics.json,artifacts/model.pkl"
          allowUpdates: true
